<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miftāḥ al-ʿIlm — مفتاح العلم</title>
<style>
:root{
  --serif:Georgia,"Times New Roman","Liberation Serif",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --forest:#183b33;--forest-2:#1f4a3d;--forest-3:#2f6b55;
  --heading:#1d3a2f;--ink:#1f2d27;--muted:#66756d;
  --paper:#f7f8f5;--card:#fff;--line:#dde3d6;
  --sage:#d9e3bb;--sage-stroke:#c9d9bd;--sage-fill:#edf3e7;--sage-line:#86a07a;
  --tan:#f8eede;--tan-ink:#a97a30;--slate:#e8ecf3;--slate-ink:#5a6c92;
  --gold:#a87727;--gold-soft:#f8efdd
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
button,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,select:focus-visible{outline:2px solid var(--forest-3);outline-offset:2px}
.arabic{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif}
.ico{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Sidebar */
.app-shell{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sidebar{background:var(--forest);color:#fff;padding:30px 18px;display:flex;flex-direction:column;gap:34px;position:sticky;top:0;height:100vh}
.side-brand{border:0;background:transparent;color:#fff;text-align:start;padding:0 10px;display:flex;align-items:center;gap:14px}
.brand-key{width:38px;height:44px;flex:none;color:var(--sage-stroke)}
.brand-text{display:grid;gap:0;min-width:0}
.brand-en{display:block;font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:-.01em;line-height:1.2}
.brand-ar{display:block;font-size:20px;font-weight:400;line-height:1.9;color:#cddacb}
.side-nav{display:grid;gap:7px}
.nav-label{margin:18px 12px 6px;color:#a9c3b7;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.nav-item{border:0;background:transparent;color:#d5e2da;border-radius:10px;display:flex;align-items:center;gap:13px;padding:13px 14px;font-size:16px;font-weight:500;text-align:start;width:100%}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--sage);color:var(--forest)}
.nav-icon{width:21px;height:21px;display:grid;place-items:center;flex:none}
.nav-icon svg{width:20px;height:20px}
.drawer-backdrop{display:none}

/* Top bar */
.main{min-width:0}
.topbar{min-height:68px;padding:12px 28px;border-bottom:1px solid var(--line);background:rgba(247,248,245,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10}
.mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:44px;height:44px;font-size:22px;color:var(--forest);flex:none}
.mobile-brand{display:none;align-items:center;gap:9px;min-width:0;border:0;background:transparent;padding:0;color:#fff;text-align:start}
.mobile-brand .brand-key{width:27px;height:32px}
.mobile-brand .brand-en{font-size:19px;white-space:nowrap}
.mobile-brand .brand-ar{display:none;font-size:20px;line-height:1.7;color:#fff;white-space:nowrap}
.crumb{color:var(--muted);font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-controls{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex:none}
.language-switch,.theme-switch{display:flex;align-items:center;border:1px solid var(--line);background:#eef0ea;border-radius:9px;padding:3px;flex:none}
.lang-btn,.theme-btn{border:0;background:transparent;color:#57625d;border-radius:7px;padding:7px 11px;font-size:13px;font-weight:500;min-width:70px}
.theme-btn{min-width:54px}
.lang-btn.active,.theme-btn.active{background:#fff;color:var(--forest);box-shadow:0 1px 4px #0000001a}

/* Screens and headings */
.content{width:min(1080px,100%);margin:0 auto;padding:clamp(24px,5vw,64px)}
.screen{display:none}
.screen.active{display:block}
.screen-heading{margin:0;color:var(--heading);font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.12;letter-spacing:-.02em}
.screen-sub{margin:10px 0 0;color:var(--muted);font-size:17px;font-weight:400}
.screen-sub.arabic{line-height:1.9;font-size:22px}
.screen-backbar{display:flex;align-items:center;margin:0 0 14px}
.back-link{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--forest-3);font-size:14px;font-weight:600;padding:7px 0}
.back-link::before{content:"\2190";font-size:17px;line-height:1}
.rtl .back-link::before{content:"\2192"}

/* Category cards */
.subject-grid,.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px;align-items:stretch}
.subject-card,.choice-card{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:22px 22px 26px;text-align:start;color:var(--ink);transition:border-color .15s,background-color .15s}
.subject-card:hover,.choice-card:hover{border-color:#b7c7ae}
.choice-card.selected{background:var(--sage-fill);border-color:var(--sage-line)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%;margin-bottom:22px}
.card-icon,.subject-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.card-icon svg{width:23px;height:23px}
.subject-icon{font-size:24px;margin-bottom:22px}
.tone-sage{background:#ecf1e4;color:#55704f}
.tone-tan{background:var(--tan);color:var(--tan-ink)}
.tone-slate{background:var(--slate);color:var(--slate-ink)}
.card-radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #c6cfc0;background:#fff;flex:none;position:relative}
.choice-card.selected .card-radio{border-color:var(--forest-3)}
.choice-card.selected .card-radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--forest-3)}
.card-ar{display:block;color:var(--forest);font-size:26px;font-weight:400;line-height:1.9}
.card-title{display:block;font-family:var(--serif);font-size:21px;font-weight:400;line-height:1.25;color:var(--heading);margin-top:2px}
.card-desc{display:block;color:var(--muted);font-size:15px;line-height:1.5;margin-top:10px}

/* Practice screen */
.practice-top{display:grid;gap:12px;margin-bottom:18px}
.practice-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mode-link{border:0;background:transparent;color:var(--forest-3);font-weight:500;padding:8px 0}
.picker-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.picker-field{display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:500}
.chapter-select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding-block:11px;padding-inline:13px 38px;font-size:15px;font-weight:400}
.chapter-meta{text-align:center;color:var(--muted);font-size:13px}
.practice-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:60px clamp(20px,5vw,48px) clamp(26px,4vw,40px)}
.book-page{position:absolute;top:16px;right:18px;z-index:1;border:1px solid #c9d6bf;background:var(--sage-fill);color:#4a6342;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;line-height:1.2;direction:ltr}
.sentence{direction:rtl;text-align:center;font-size:clamp(38px,6.4vw,60px);font-weight:600;line-height:2.05;color:var(--forest);margin:0 auto;padding:.1em 0;max-width:900px}
.translation{text-align:center;color:#56655d;font-size:clamp(17px,2.1vw,20px);font-weight:400;line-height:1.6;margin:6px auto 26px;max-width:760px}
.practice-actions{display:grid;grid-template-columns:1fr minmax(180px,1.35fr) 1fr;gap:12px;max-width:640px;margin:26px auto 0}
.primary,.secondary{min-height:50px;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:500}
.primary{border:1px solid var(--forest-2);background:var(--forest-2);color:#fff}
.primary:hover:not(:disabled){background:var(--forest)}
.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.secondary:hover:not(:disabled){border-color:#b7c7ae;background:var(--sage-fill)}

/* Revealed iʿrāb */
.answer-panel{display:none;border-top:1px solid var(--line);margin-top:34px;padding-top:30px}
.answer-panel.open{display:block}
.answer-title{text-align:center;color:var(--heading);font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 16px}
.answers{display:grid;gap:12px;max-width:820px;margin:0 auto}
.word-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.word-head{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--sage-fill);padding:8px 14px}
.word-ar{direction:rtl;color:var(--forest);font-size:30px;font-weight:600;line-height:2}
.word-gloss{color:var(--muted);font-size:14px}
.iraab-ar{direction:rtl;text-align:right;padding:12px 16px;font-size:21px;line-height:2.15}
.parsed-focus{font-weight:800;color:var(--forest);text-decoration-thickness:.08em;text-underline-offset:.12em}
.focus-separator{font-weight:400;color:var(--muted)}
.iraab-en{border-top:1px solid #e9ece4;padding:12px 16px;color:#515c57;line-height:1.6}
.answer-part+.answer-part{border-top:1px solid var(--line)}
.why-toggle{border:0;background:transparent;color:#2f6350;font-weight:500;padding:0 16px 13px}
.why-text{display:none;margin:0 16px 15px;padding:11px 13px;background:#faf6ed;border-inline-start:3px solid var(--gold);color:#4c5752;line-height:1.65}
.why-text.open{display:block}
.why-ar{direction:rtl;text-align:right;font-size:19px;line-height:2.1}
.source-detail{max-width:820px;margin:14px auto 0;border:1px solid #e3dac8;background:var(--gold-soft);border-radius:10px;padding:13px 15px;color:#5c564b;line-height:1.7;font-size:14px}

/* Chapter Help */
.help-picker{margin-top:22px}
.help-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(22px,4vw,36px);margin-top:16px}
.help-section{padding:19px 0;border-top:1px solid var(--line)}
.help-section:first-child{border-top:0;padding-top:0}
.help-ar{direction:rtl;text-align:right;font-size:22px;line-height:2.15;color:var(--forest)}
.help-en{color:#4f5b55;line-height:1.7;margin-top:6px}
.help-actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.help-actions button{width:auto;min-width:180px}

/* Preferences */
.preferences-card{max-width:720px;margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(22px,4vw,34px);display:flex;align-items:center;justify-content:space-between;gap:24px}
.preferences-copy h2{margin:0;color:var(--heading);font-family:var(--serif);font-size:24px;font-weight:400}
.preferences-copy p{margin:7px 0 0;color:var(--muted);line-height:1.55}
.preferences-theme .theme-btn{min-width:86px}

/* Dark theme */
html[data-theme="dark"]{color-scheme:dark;--heading:#e5eee8;--ink:#e8efeb;--muted:#aebbb4;--paper:#0f1714;--card:#17211d;--line:#34443d;--sage-fill:#24372f;--sage-line:#78927b;--gold-soft:#30291d;--tan:#33291d;--slate:#252d3b}
html[data-theme="dark"] .topbar{background:rgba(15,23,20,.94)}
html[data-theme="dark"] .mobile-menu,html[data-theme="dark"] .chapter-select,html[data-theme="dark"] .secondary,html[data-theme="dark"] .word-card{background:var(--card);color:var(--ink)}
html[data-theme="dark"] .language-switch,html[data-theme="dark"] .theme-switch{background:#25332d;border-color:#405149}
html[data-theme="dark"] .lang-btn,html[data-theme="dark"] .theme-btn{color:#bdc9c2}
html[data-theme="dark"] .lang-btn.active,html[data-theme="dark"] .theme-btn.active{background:#41534b;color:#fff;box-shadow:0 1px 4px #0006}
html[data-theme="dark"] .subject-card:hover,html[data-theme="dark"] .choice-card:hover,html[data-theme="dark"] .secondary:hover:not(:disabled){border-color:#64806f}
html[data-theme="dark"] .card-ar,html[data-theme="dark"] .sentence,html[data-theme="dark"] .word-ar,html[data-theme="dark"] .help-ar{color:#dcebe1}
html[data-theme="dark"] .parsed-focus{color:#dff0e3}
html[data-theme="dark"] .tone-sage{background:#263a30;color:#b9d2bd}
html[data-theme="dark"] .tone-tan{color:#e3bc7d}
html[data-theme="dark"] .tone-slate{color:#b9c7e4}
html[data-theme="dark"] .card-radio{background:#18231f;border-color:#617169}
html[data-theme="dark"] .translation,html[data-theme="dark"] .iraab-en,html[data-theme="dark"] .help-en{color:#c2cdc7}
html[data-theme="dark"] .iraab-en{border-color:var(--line)}
html[data-theme="dark"] .book-page{background:#24372f;border-color:#4d6a59;color:#cfe1d3}
html[data-theme="dark"] .why-toggle,html[data-theme="dark"] .mode-link{color:#9acbb7}
html[data-theme="dark"] .why-text{background:#29251d;color:#d7d0c3}
html[data-theme="dark"] .source-detail{border-color:#594b36;color:#d8ceba}
html[data-theme="dark"] .primary{background:#39725b;border-color:#579276}
html[data-theme="dark"] .primary:hover:not(:disabled){background:#458369}

/* Arabic-only mode */
.rtl .crumb,.rtl .subject-card,.rtl .choice-card{text-align:right}
.rtl .brand-en,.rtl .screen-sub.arabic,.rtl .card-title,.rtl .help-en{display:none}
.rtl .brand-ar{display:block}
.rtl .word-gloss:empty{display:none}
.rtl .screen-heading,.rtl .answer-title{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;font-weight:600;line-height:1.7}

@media(max-width:760px){
  .app-shell{display:block}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(82vw,300px);height:100vh;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:18px 0 45px #0004}
  .rtl .sidebar{inset:0 0 0 auto;transform:translateX(105%)}
  body.menu-open .sidebar{transform:translateX(0)}
  .drawer-backdrop{display:block;position:fixed;inset:0;background:#06171180;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  body.menu-open .drawer-backdrop{opacity:1;pointer-events:auto}
  .topbar{min-height:60px;padding:8px 13px;background:var(--forest);border-bottom:0;backdrop-filter:none}
  .mobile-menu{display:grid;place-items:center;background:transparent;border-color:#ffffff40;color:#fff}
  .mobile-brand{display:flex}
  .crumb{display:none}
  .header-controls{gap:5px}
  .language-switch,.theme-switch{background:#ffffff1f;border-color:#ffffff2e}
  .lang-btn,.theme-btn{min-width:58px;padding:7px 6px;color:#d5e2da}
  .theme-btn{min-width:46px}
  .lang-btn.active,.theme-btn.active{background:#fff;color:var(--forest)}
  .content{padding:20px 13px 40px}
  .screen-heading{font-size:clamp(28px,8vw,36px)}
  .subject-grid,.choice-grid{grid-template-columns:1fr;gap:10px;margin-top:20px}
  .subject-card,.choice-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:14px;row-gap:0;align-items:center;padding:10px 14px;min-height:64px}
  .card-top{display:contents}
  .card-icon,.subject-icon{grid-column:1;grid-row:1/span 2;width:40px;height:40px;margin:0}
  .card-icon svg{width:21px;height:21px}
  .card-radio{grid-column:3;grid-row:1/span 2}
  .card-ar{grid-column:2;grid-row:1;font-size:21px;line-height:1.65}
  .card-title{grid-column:2;grid-row:2;font-size:17px;margin:0}
  .card-desc{display:none}
  .practice-nav{display:flex}
  .back-link{font-size:13px;padding:5px 0}
  .picker-grid{grid-template-columns:1fr}
  .chapter-select{font-size:14px}
  .practice-card{padding:54px 16px 21px}
  .book-page{top:15px;right:15px}
  .sentence{font-size:clamp(32px,10vw,46px);line-height:2}
  .translation{font-size:16px;margin:4px auto 16px}
  .practice-actions{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:6px;margin-top:16px}
  .primary,.secondary{min-width:0;min-height:48px;padding:9px 5px;font-size:13px}
  .answer-panel{margin-top:26px;padding-top:24px}
  .word-head{align-items:flex-start}
  .iraab-ar{font-size:20px;padding:11px 14px}
  .iraab-en{padding:11px 14px}
  .source-detail{padding:12px}
}
@media(max-width:390px){
  .lang-btn{min-width:56px;font-size:12px}
  .theme-btn{min-width:42px;font-size:11px;padding-inline:4px}
  .mobile-brand .brand-text,.mobile-brand .brand-en,.mobile-brand .brand-ar{display:none}
  .sentence{font-size:34px}
  .primary,.secondary{font-size:12px}
  .preferences-card{align-items:stretch;flex-direction:column}
  .preferences-theme{align-self:flex-start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="keyMark" viewBox="0 0 48 56"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M24 1 36 7 42 18 37 28 30 33V38H42V44H36V49H30V56H18V33L11 28 6 18 12 7 24 1Zm0 8-6 4-3 5 3 6 6 4 6-4 3-6-3-5-6-4Z"/></symbol>
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M4 11.2 12 4.5l8 6.7M6.2 9.6V19.5h11.6V9.6"/></symbol>
  <symbol id="ic-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></symbol>
  <symbol id="ic-book" viewBox="0 0 24 24"><path d="M12 6.6C10 5 7 4.6 4 5.1v13.2c3-.5 6 0 8 1.6 2-1.6 5-2.1 8-1.6V5.1c-3-.5-6-.1-8 1.5zM12 6.6v13.3"/></symbol>
  <symbol id="ic-cycle" viewBox="0 0 24 24"><path d="M19.6 12a7.6 7.6 0 0 1-13.2 5.1M4.4 12a7.6 7.6 0 0 1 13.2-5.1M17.8 3.6v3.6h-3.6M6.2 20.4v-3.6h3.6"/></symbol>
  <symbol id="ic-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M9.6 9.7a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7M12 16.7v.1"/></symbol>
  <symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2.2-.7a7 7 0 0 0-.7-1.7l1.1-2-2.1-2.1-2 1.1a7 7 0 0 0-1.7-.7L10.5 2h-3l-.7 2.4a7 7 0 0 0-1.7.7l-2-1.1L1 6.1l1.1 2a7 7 0 0 0-.7 1.7L-1 10.5v3l2.4.7a7 7 0 0 0 .7 1.7l-1.1 2L3.1 20l2-1.1a7 7 0 0 0 1.7.7l.7 2.4h3l.7-2.4a7 7 0 0 0 1.7-.7l2 1.1 2.1-2.1-1.1-2a7 7 0 0 0 .7-1.7z" transform="translate(3) scale(.75)"/></symbol>
</svg>
<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <button class="side-brand" data-go="home" aria-label="Miftāḥ al-ʿIlm"><svg class="brand-key ico" aria-hidden="true"><use href="#keyMark"/></svg><span class="brand-text"><span class="brand-en">Miftāḥ al-ʿIlm</span><span class="brand-ar arabic ui-ar" lang="ar">مفتاح العلم</span></span></button>
    <nav class="side-nav"><button class="nav-item" data-go="home"><span class="nav-icon"><svg class="ico" aria-hidden="true"><use href="#ic-home"/></svg></span><span data-i18n="home">Home</span></button><div class="nav-label" data-i18n="workspace">Your Workspace</div><button class="nav-item" data-go="nahw"><span class="nav-icon"><svg class="ico" aria-hidden="true"><use href="#ic-grid"/></svg></span><span data-i18n="practice">Practice</span></button><button class="nav-item" data-go="preferences"><span class="nav-icon"><svg class="ico" aria-hidden="true"><use href="#ic-settings"/></svg></span><span data-i18n="preferences">Preferences</span></button></nav>
  </aside>

function renderNav(){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===`${state.screen}Screen`));const activeNav=state.screen==='home'?'home':state.screen==='preferences'?'preferences':'nahw';document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.go===activeNav));const crumbKeys={home:'home',nahw:'nahwCrumb',help:'helpCrumb',preferences:'preferencesCrumb',practice:state.mode==='book'?'bookCrumb':'extraCrumb'};$('crumb').textContent=tr(crumbKeys[state.screen]);const category=['book','extra','help'].includes(state.category)?state.category:'book';document.querySelectorAll('.choice-card').forEach(card=>{const selected=(card.dataset.start||'help')===category;card.classList.toggle('selected',selected);card.setAttribute('aria-pressed',String(selected))});$('returnPractice').style.display=state.resumeAvailable?'inline-flex':'none'}
function renderAnswer(exercise){const arabic=state.lang==='ar',words=quotedWords(exercise);$('answers').innerHTML=exercise.tokens.map((token,index)=>{const why=arabic?token.whyAr:token.whyEn,parts=token.parts||[{ar:token.ar,en:token.en}],answer=parts.map(part=>`<div class="answer-part"><div class="iraab-ar arabic" lang="ar">${emphasizeIraab(part.ar,token.word)}</div>${arabic?'':`<div class="iraab-en">${escapeHtml(part.en)}</div>`}</div>`).join('');return `<article class="word-card"><div class="word-head"><span class="word-gloss">${arabic?'':escapeHtml(token.gloss)}</span><span class="word-ar arabic" lang="ar">${escapeHtml(token.word)}</span></div>${answer}${why?`<button class="why-toggle" data-why="${index}" aria-expanded="false">${tr('why')}</button><div class="why-text ${arabic?'why-ar arabic':''}" id="why-${index}">${arabic?arabicDisplay(token.whyAr,{words}):escapeHtml(token.whyEn)}</div>`:''}</article>`}).join('');$('sourceDetail').textContent=arabic?arabicDisplay(exercise.sourceAr,{words}):exercise.sourceEn}
function renderPractice(){const exercise=currentExercise(),chapter=selectedChapter(),arabic=state.lang==='ar',index=currentIndex(),total=state.mode==='extra'?null:chapter.book.length;$('sentence').textContent=exercise.ar;$('translation').textContent=exercise.en;$('translation').style.display=arabic?'none':'block';$('bookPage').textContent=state.mode==='book'?(arabic?`ص ${localDigits(exercise.page)}`:`pg:${exercise.page}`):'';$('bookPage').style.display=state.mode==='book'?'block':'none';$('answerPanel').classList.toggle('open',state.revealed);$('previousBtn').textContent=tr('previous');$('revealBtn').textContent=state.revealed?tr('hide'):tr('reveal');$('nextBtn').textContent=tr('next');$('previousBtn').disabled=index===0;$('nextBtn').disabled=state.mode==='book'&&index===total-1;$('chapterMeta').textContent=state.mode==='extra'?tr('generated'):`${tr('item')} ${localDigits(index+1)} ${tr('of')} ${localDigits(total)}`;renderAnswer(exercise)}
function renderHelp(){const chapter=chapterById(state.helpChapterId),arabic=state.lang==='ar';$('helpChapterName').textContent=optionLabel(chapter);$('helpSections').innerHTML=chapter.help.map(section=>`<section class="help-section"><div class="help-ar arabic" lang="ar">${arabicDisplay(section.ar,{quotes:HELP_KEEPS_QUOTES})}</div>${arabic?'':`<div class="help-en">${section.en}</div>`}</section>`).join('');$('helpSource').textContent=arabic?arabicDisplay(chapter.helpSourceAr,{quotes:HELP_KEEPS_QUOTES}):chapter.helpSourceEn}
function render(){validateSelection();renderLanguage();renderTheme();renderPickers();renderNav();renderPractice();renderHelp();save()}
document.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>setScreen(button.dataset.go)));document.querySelectorAll('[data-start]').forEach(button=>button.addEventListener('click',()=>startPractice(button.dataset.start)));document.querySelectorAll('[data-help]').forEach(button=>button.addEventListener('click',openHelp));document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{state.lang=button.dataset.lang;render()}));
document.querySelectorAll('[data-theme-choice]').forEach(button=>button.addEventListener('click',()=>{state.theme=button.dataset.themeChoice;render()}));
$('nahwMenuLink').addEventListener('click',()=>setScreen('nahw'));$('helpNahwLink').addEventListener('click',()=>setScreen('nahw'));$('returnPractice').addEventListener('click',()=>setScreen('practice'));$('returnNahw').addEventListener('click',()=>setScreen('nahw'));$('revealBtn').addEventListener('click',()=>{state.revealed=!state.revealed;render()});$('previousBtn').addEventListener('click',()=>{const index=currentIndex();if(index<=0)return;if(state.mode==='book')state.positions[selectedChapter().id]=index-1;else state.generatedIndex-=1;state.revealed=false;render()});$('nextBtn').addEventListener('click',()=>{if(state.mode==='book'){const chapter=selectedChapter(),index=currentIndex();if(index>=chapter.book.length-1)return;state.positions[chapter.id]=index+1}else state.generatedIndex+=1;state.revealed=false;render()});
$('babSelect').addEventListener('change',event=>{state.selectedBabId=event.target.value;state.selectedChapterId=chaptersFor(state.selectedBabId)[0].id;state.revealed=false;render()});$('chapterSelect').addEventListener('change',event=>{state.selectedChapterId=event.target.value;state.revealed=false;render()});$('helpBabSelect').addEventListener('change',event=>{state.helpBabId=event.target.value;state.helpChapterId=chaptersFor(state.helpBabId)[0].id;render()});$('helpChapterSelect').addEventListener('change',event=>{state.helpChapterId=event.target.value;render()});
$('answers').addEventListener('click',event=>{const button=event.target.closest('[data-why]');if(!button)return;const why=$(`why-${button.dataset.why}`),open=why.classList.toggle('open');button.setAttribute('aria-expanded',String(open));button.textContent=open?tr('hideWhy'):tr('why')});$('mobileMenu').addEventListener('click',()=>document.body.classList.toggle('menu-open'));$('drawerBackdrop').addEventListener('click',()=>document.body.classList.remove('menu-open'));
window.miftahTestState=()=>({...state});window.miftahArabicDisplay={stripMarks,arabicDisplay,quotedWords,emphasizeIraab};window.miftahContentSummary=()=>chapters.map(c=>({id:c.id,babId:c.babId,pages:c.pages,count:c.book.length,ids:c.book.map(e=>e.id)}));render();
})();
</script>
