<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miftāḥ al-ʿIlm — مفتاح العلم</title>
<style>
/* Lotus is resolved only from a user's licensed local installation. Amiri is the bundled OFL fallback. */
@font-face{font-family:"Miftah Lotus";src:local("Lotus Linotype Light"),local("Lotus-Light");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Miftah Amiri";src:url("assets/fonts/Amiri-Regular.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Miftah Amiri";src:url("assets/fonts/Amiri-Bold.ttf") format("truetype");font-style:normal;font-weight:700;font-display:swap}
:root{
  --serif:Georgia,"Times New Roman","Liberation Serif",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --arabic:"Miftah Lotus","Lotus Linotype Light","Lotus-Light","Miftah Amiri","Amiri",serif;
  --forest:#183b33;--forest-2:#1f4a3d;--forest-3:#2f6b55;
  --heading:#1d3a2f;--ink:#1f2d27;--muted:#66756d;
  --paper:#f7f8f5;--card:#fff;--line:#dde3d6;
  --sage:#d9e3bb;--sage-stroke:#c9d9bd;--sage-fill:#edf3e7;--sage-line:#86a07a;
  --tan:#f8eede;--tan-ink:#a97a30;--slate:#e8ecf3;--slate-ink:#5a6c92;
  --gold:#a87727;--gold-soft:#f8efdd
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
button,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--forest-3);outline-offset:3px}
.arabic{font-family:var(--arabic);font-variant-ligatures:common-ligatures contextual;font-feature-settings:"liga" 1,"calt" 1,"mark" 1,"mkmk" 1;font-kerning:normal;text-rendering:optimizeLegibility;letter-spacing:0}
.ico{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Sidebar */
.app-shell{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sidebar{background:var(--forest);color:#fff;padding:30px 18px;display:flex;flex-direction:column;gap:34px;position:sticky;top:0;height:100vh}
.side-brand{border:0;background:transparent;color:#fff;text-align:start;padding:0 10px;display:flex;align-items:center;gap:14px}
.brand-key{width:38px;height:44px;flex:none;color:var(--sage-stroke)}
.brand-text{display:grid;gap:0;min-width:0}
.brand-en{display:block;font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:-.01em;line-height:1.2}
.brand-ar{display:block;font-size:20px;font-weight:400;line-height:1.9;color:#cddacb}
.side-nav{display:grid;gap:7px}
.nav-label{margin:18px 12px 6px;color:#a9c3b7;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.nav-item{border:0;background:transparent;color:#d5e2da;border-radius:10px;display:flex;align-items:center;gap:13px;padding:13px 14px;font-size:16px;font-weight:500;text-align:start;width:100%}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--sage);color:var(--forest)}
.nav-icon{width:21px;height:21px;display:grid;place-items:center;flex:none}
.nav-icon svg{width:20px;height:20px}
.drawer-backdrop,.drawer-close,.drawer-backdrop[hidden],.sidebar[hidden]{display:none}

/* Top bar */
.main{min-width:0}
.topbar{min-height:68px;padding:12px 28px;border-bottom:1px solid var(--line);background:rgba(247,248,245,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:10}
.mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:44px;height:44px;font-size:22px;color:var(--forest);flex:none}
.mobile-brand{display:none;align-items:center;gap:9px;min-width:0;border:0;background:transparent;padding:0;color:#fff;text-align:start}
.mobile-brand .brand-key{width:27px;height:32px}
.mobile-brand .brand-en{font-size:19px;white-space:nowrap}
.mobile-brand .brand-ar{display:none;font-size:20px;line-height:1.7;color:#fff;white-space:nowrap}
.crumb{color:var(--muted);font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-controls{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex:none}
.language-switch,.theme-switch{display:flex;align-items:center;border:1px solid var(--line);background:#eef0ea;border-radius:9px;padding:3px;flex:none}
.lang-btn,.theme-btn{border:0;background:transparent;color:#57625d;border-radius:7px;padding:7px 11px;font-size:13px;font-weight:500;min-width:70px}
.theme-btn{min-width:54px}
.lang-btn.active,.theme-btn.active{background:#fff;color:var(--forest);box-shadow:0 1px 4px #0000001a}

/* Screens and headings */
.content{width:min(1080px,100%);margin:0 auto;padding:clamp(24px,5vw,64px)}
.screen{display:none}
.screen.active{display:block}
.screen-heading{margin:0;color:var(--heading);font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.12;letter-spacing:-.02em}
.screen-sub{margin:10px 0 0;color:var(--muted);font-size:17px;font-weight:400}
.screen-sub.arabic{line-height:1.9;font-size:22px}
.screen-backbar{display:flex;align-items:center;margin:0 0 14px}
.back-link{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--forest-3);font-size:14px;font-weight:600;padding:7px 0}
.back-link::before{content:"\2190";font-size:17px;line-height:1}
.rtl .back-link::before{content:"\2192"}

/* Category cards */
.subject-grid,.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:32px;align-items:stretch}
.subject-card,.choice-card{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:22px 22px 26px;text-align:start;color:var(--ink);transition:border-color .15s,background-color .15s}
.subject-card:hover,.choice-card:hover{border-color:#b7c7ae}
.choice-card.selected{background:var(--sage-fill);border-color:var(--sage-line)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%;margin-bottom:22px}
.card-icon,.subject-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.card-icon svg{width:23px;height:23px}
.subject-icon{font-size:24px;margin-bottom:22px}
.tone-sage{background:#ecf1e4;color:#55704f}
.tone-tan{background:var(--tan);color:var(--tan-ink)}
.tone-slate{background:var(--slate);color:var(--slate-ink)}
.card-radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #c6cfc0;background:#fff;flex:none;position:relative}
.choice-card.selected .card-radio{border-color:var(--forest-3)}
.choice-card.selected .card-radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--forest-3)}
.card-ar{display:block;color:var(--forest);font-size:26px;font-weight:400;line-height:1.9}
.card-title{display:block;font-family:var(--serif);font-size:21px;font-weight:400;line-height:1.25;color:var(--heading);margin-top:2px}
.card-desc{display:block;color:var(--muted);font-size:15px;line-height:1.5;margin-top:10px}

/* Practice screen */
.practice-top{display:grid;gap:12px;margin-bottom:18px}
.practice-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.practice-nav-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.mode-link{border:0;background:transparent;color:var(--forest-3);font-weight:500;padding:8px 0}
.chapter-essentials-link{border:1px solid var(--sage-line);background:var(--sage-fill);color:var(--forest);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700}
.picker-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.picker-field{display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:500}
.chapter-select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding-block:11px;padding-inline:38px 13px;font-family:var(--arabic);font-size:17px;font-weight:400;line-height:1.8;direction:rtl;text-align:right}
.chapter-select option{direction:rtl;text-align:right;font-family:var(--arabic)}
.chapter-meta{text-align:center;color:var(--muted);font-size:13px}
.example-filter{display:flex;align-items:center;justify-content:center;gap:3px;width:max-content;max-width:100%;margin:0 auto;border:1px solid var(--line);background:#eef0ea;border-radius:9px;padding:3px}
.example-filter[hidden]{display:none}
.filter-btn{border:0;background:transparent;color:#57625d;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.filter-btn.active{background:var(--card);color:var(--forest);box-shadow:0 1px 4px #0000001a}
.example-jump{min-width:0;margin:0 0 14px;text-align:center}
.example-jump[hidden],.example-jump-panel[hidden],.example-jump-current[hidden]{display:none}
.example-jump-toggle{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
.example-jump-toggle::after{content:"";width:.48em;height:.48em;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-.25em}
.example-jump-toggle[aria-expanded="true"]::after{transform:rotate(225deg);margin-top:.25em}
.example-jump-panel{margin:9px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:start;overflow:hidden}
.example-jump-items{list-style:none;margin:0;padding:4px;max-height:min(46vh,23rem);overflow:auto;overscroll-behavior-y:contain}
.example-jump-items li+li{border-top:1px solid var(--line)}
.example-jump-row{width:100%;display:grid;gap:3px;min-width:0;min-height:44px;border:0;border-inline-start:3px solid transparent;border-radius:5px;background:transparent;padding:6px 10px;color:var(--ink);text-align:start;overflow-wrap:anywhere}
.example-jump-row:hover,.example-jump-row[aria-current="true"]{background:var(--sage-fill)}
.example-jump-row[aria-current="true"]{border-inline-start-color:var(--forest-3)}
.example-jump-row:focus-visible{outline-offset:-3px}
.example-jump-meta{display:flex;align-items:baseline;gap:5px 9px;flex-wrap:wrap;font-size:12px;color:var(--muted);line-height:1.4}
.example-jump-page{padding:1px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}
.example-jump-current{margin-inline-start:auto;color:var(--ink);font-weight:700}
.example-jump-prompt{min-width:0;direction:rtl;text-align:right;font-size:clamp(21px,4.5vw,27px);line-height:1.8}
.example-jump-prompt .quran-ref{font-size:.66em;white-space:normal;max-width:100%}
@media (min-width:1100px){
  .has-example-jump .practice-workspace{display:grid;direction:ltr;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:start}
  .has-example-jump.example-jump-open .practice-workspace{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(16px,2vw,28px)}
  .rtl .has-example-jump .practice-workspace > *{direction:rtl}
  .has-example-jump .practice-card{grid-area:1/1;min-width:0}
  .example-jump-open .practice-card{padding-inline:clamp(18px,2.3vw,34px)}
  .example-jump-open .practice-actions{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:8px}
  .example-jump-open .practice-actions button{padding-inline:8px}
  .has-example-jump .sentence{overflow-wrap:anywhere}
  .example-jump-open .sentence{font-size:clamp(40px,4.2vw,58px)}
  .has-example-jump .answer-panel{overflow-wrap:anywhere}
  .example-jump{grid-area:1/2;margin:0;text-align:start;overflow-anchor:none}
  .example-jump-toggle{width:100%;justify-content:space-between;padding-inline:14px}
  .example-jump-toggle[aria-expanded="false"]{position:relative;display:block;height:174px;padding:0;background:var(--sage-fill);border-color:var(--sage-line)}
  .example-jump-toggle[aria-expanded="false"]:hover{border-color:var(--forest-3)}
  /* Rotate the shaped label as one line; vertical typesetting can split Arabic letters. */
  .example-jump-toggle[aria-expanded="false"] .example-jump-label{position:absolute;top:calc(50% - 8px);left:50%;white-space:nowrap;transform:translate(-50%,-50%) rotate(90deg)}
  .example-jump-toggle[aria-expanded="false"]::after{position:absolute;bottom:11px;left:50%;margin:0;transform:translateX(-50%) rotate(135deg)}
  .example-jump-panel{overflow:visible}
  .example-jump-items{max-height:none;overflow:visible;overscroll-behavior-y:auto}
  .example-jump-prompt{font-size:23px;line-height:1.65}
}
#sentence:focus{scroll-margin-block:90px 24px}
.filter-empty{border:1px dashed var(--sage-line);border-radius:12px;background:var(--sage-fill);padding:26px;text-align:center;color:var(--ink)}
.filter-empty p{margin:0 0 14px;line-height:1.6}
.filter-empty .secondary{min-width:180px}
.practice-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:60px clamp(20px,5vw,48px) clamp(26px,4vw,40px)}
.book-page{position:absolute;top:16px;right:18px;z-index:1;border:1px solid #c9d6bf;background:var(--sage-fill);color:#4a6342;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;line-height:1.2;direction:ltr}
.sentence{direction:rtl;text-align:center;font-size:clamp(38px,6.4vw,60px);font-weight:400;line-height:2.3;color:var(--forest);margin:0 auto;padding:.18em 0;max-width:900px;overflow:visible}
.quran-quote{unicode-bidi:isolate;white-space:normal}
.quran-verse-end{display:inline-grid;place-items:center;vertical-align:middle;min-width:1.2em;min-height:1.2em;margin-inline:.14em;border:1px solid currentColor;border-radius:50%;font-size:.53em;line-height:1}
.picker-scope{grid-column:1/-1;margin:0;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.quran-lead{unicode-bidi:isolate;margin-inline-end:.08em}
.quran-ref{display:inline-block;margin-inline-start:.5em;direction:rtl;unicode-bidi:isolate;white-space:nowrap;font-family:var(--arabic);font-size:.38em;font-weight:400;line-height:1.9;color:var(--muted);vertical-align:.14em}
.translation{text-align:center;color:#56655d;font-size:clamp(17px,2.1vw,20px);font-weight:400;line-height:1.6;margin:6px auto 26px;max-width:760px}
.practice-actions{display:grid;grid-template-columns:1fr minmax(180px,1.35fr) 1fr;gap:12px;max-width:640px;margin:26px auto 0}
.primary,.secondary{min-height:50px;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:500}
.primary{border:1px solid var(--forest-2);background:var(--forest-2);color:#fff}
.primary:hover:not(:disabled){background:var(--forest)}
.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.secondary:hover:not(:disabled){border-color:#b7c7ae;background:var(--sage-fill)}

/* Revealed iʿrāb */
.answer-panel{display:none;border-top:1px solid var(--line);margin-top:34px;padding-top:30px}
.answer-panel.open{display:block}
.answer-title{text-align:center;color:var(--heading);font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 16px}
.answers{display:grid;gap:12px;max-width:820px;margin:0 auto}
.word-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.word-head{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--sage-fill);padding:8px 14px}
.word-ar{direction:rtl;color:var(--forest);font-size:31px;font-weight:400;line-height:2.35;padding-block:.08em;overflow:visible}
.word-gloss{color:var(--muted);font-size:14px}
.iraab-ar{direction:rtl;text-align:right;padding:14px 16px;font-size:22px;line-height:2.45;overflow:visible}
.parsed-focus{font-weight:800;color:var(--forest);text-decoration-thickness:.08em;text-underline-offset:.12em}
.focus-separator{font-weight:400;color:var(--muted)}
.iraab-en{border-top:1px solid #e9ece4;padding:12px 16px;color:#515c57;line-height:1.6}
.answer-part+.answer-part{border-top:1px solid var(--line)}
.why-cue{margin:0 14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.why-cue summary{padding:7px 11px;cursor:pointer;color:var(--heading);font-size:.875rem;font-weight:600;line-height:1.45}
.why-cue summary[lang="ar"]{font-size:1.16rem;line-height:1.65}
.why-cue-body{padding:9px 11px 11px;border-top:1px solid var(--line)}
.why-cue:not([open])>.why-cue-body{display:none}
.why-cue-body p{margin:0;overflow-wrap:anywhere}
.why-cue-body p[lang="ar"]{font-size:1.22rem;line-height:1.9}
.why-cue-body p[lang="en"]{margin-top:5px;font-size:.9375rem;line-height:1.55}
.why-cue-credit{display:block;margin-top:6px;color:var(--muted);font-size:.75rem}
.why-toggle{border:0;background:transparent;color:#2f6350;font-weight:500;padding:0 16px 13px}
.why-text{display:none;margin:0 16px 15px;padding:11px 13px;background:#faf6ed;border-inline-start:3px solid var(--gold);color:#4c5752;line-height:1.65}
.why-text.open{display:block}
.why-ar{direction:rtl;text-align:right;font-size:19px;line-height:2.1}
.source-detail{max-width:820px;margin:14px auto 0;border:1px solid #e3dac8;background:var(--gold-soft);border-radius:10px;padding:13px 15px;color:#5c564b;line-height:1.7;font-size:14px}

/* Chapter Help */
.help-picker{margin-top:22px}
.help-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(22px,4vw,36px);margin-top:16px}
.help-core{position:relative;border:1px solid var(--sage-line);border-radius:14px;background:var(--sage-fill);padding:clamp(20px,4vw,32px);overflow:hidden}
.help-core::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--forest-3)}
.help-kicker{margin:0;color:var(--forest-3);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.help-core-title{margin:4px 0 8px;color:var(--heading);font-size:clamp(25px,4vw,34px);font-weight:700;line-height:1.8;direction:rtl;text-align:right}
.help-core-en{margin:0;color:var(--ink);font-family:var(--serif);font-size:clamp(18px,2.2vw,22px);line-height:1.5}
.help-policy{display:flex;align-items:flex-start;gap:7px;margin:13px 0 0;padding-top:11px;border-top:1px solid color-mix(in srgb,var(--sage-line) 70%,transparent);color:var(--muted);font-size:12px;line-height:1.5}
.help-policy::before{content:"i";display:grid;place-items:center;width:17px;height:17px;border:1px solid currentColor;border-radius:50%;font:700 11px/1 var(--serif);flex:none;margin-top:1px}
.help-jump-nav{display:flex;align-items:center;gap:7px;overflow-x:auto;margin:16px 0;padding:4px 1px 8px;scrollbar-width:thin;overscroll-behavior-inline:contain}
.help-jump{flex:none;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--forest-3);padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.help-region{scroll-margin-top:88px}
.help-region-heading{margin:0 0 12px;color:var(--heading);font-size:22px;font-weight:700;line-height:1.6}
.help-region-heading .help-heading-ar{display:block;direction:rtl;text-align:right;font-size:22px;line-height:1.8}
.help-region-heading .help-heading-en{display:block;color:var(--muted);font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.35}
.help-essentials-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.help-essential{min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:16px;scroll-margin-top:88px}
.help-essential-label{margin:0 0 7px;color:var(--forest-3);font-size:16px;font-weight:700;line-height:1.7;direction:rtl;text-align:right}
.help-essential-label-en{display:block;color:var(--muted);font-family:var(--serif);font-size:13px;font-weight:400;line-height:1.3;direction:ltr;text-align:left}
.help-essential-ar{direction:rtl;text-align:right;color:var(--forest);font-size:20px;line-height:2.05}
.help-essential-en{margin-top:4px;color:#4f5b55;line-height:1.6}
.help-model{grid-column:1/-1;padding:0;overflow:hidden}
.help-model>.help-essential-label{padding:13px 16px 0}
.help-model .visual-row-link{border-top:0}
.help-cautions{grid-column:1/-1;border-color:#e3dac8;background:var(--gold-soft)}
.help-full{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.help-disclosure{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;margin-top:9px;scroll-margin-top:88px}
.help-disclosure summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;color:var(--heading);cursor:pointer;list-style:none;font-weight:700}
.help-disclosure summary::-webkit-details-marker{display:none}
.help-disclosure summary::after{content:"+";display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--sage-fill);color:var(--forest-3);font:700 18px/1 var(--sans);flex:none}
.help-disclosure[open] summary::after{content:"−"}
.help-disclosure[open] summary{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sage-fill) 55%,var(--card))}
.help-disclosure-title-ar{display:block;direction:rtl;text-align:right;font-size:19px;line-height:1.8}
.help-disclosure-title-en{display:block;color:var(--muted);font-family:var(--serif);font-size:13px;font-weight:400;line-height:1.35}
.help-disclosure-body{padding:16px}
.help-section{padding:0}
.help-ar{direction:rtl;text-align:right;font-size:22px;line-height:2.15;color:var(--forest)}
.help-en{color:#4f5b55;line-height:1.7;margin-top:6px}
.help-visual-region,.help-source-region{margin-top:26px;border-top:1px solid var(--line);padding-top:24px}
.help-visual{margin-top:0}
.help-visual:empty,.help-visual-region[hidden]{display:none}
.visual-title{margin:0 0 16px;color:var(--heading);font-size:24px;font-weight:700;line-height:1.9;text-align:right;direction:rtl}
.visual-title-en{display:block;color:var(--muted);font-family:var(--serif);font-size:17px;font-weight:400;line-height:1.35;direction:ltr;text-align:left}
.visual-branches{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.visual-branch-tier{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--visual-branch-columns,3),minmax(0,1fr));gap:10px}
.visual-branch{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:13px;text-align:start;min-height:78px}
.visual-branch.active{border-color:var(--sage-line);background:var(--sage-fill)}
.visual-branch-ar{display:block;direction:rtl;text-align:right;color:var(--forest);font-size:20px;font-weight:700;line-height:1.9}
.visual-branch-en{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.visual-subbranches{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--visual-branch-columns,2),minmax(0,1fr));gap:10px;margin-inline:18px;padding-inline-start:18px;border-inline-start:2px solid var(--sage-line)}
.visual-subbranches.visual-branch-depth-2{margin-inline:36px;padding-inline-start:22px}
.visual-subbranches .visual-branch{min-height:68px;background:color-mix(in srgb,var(--sage-fill) 45%,var(--card))}
.visual-panel{grid-column:1/-1;border:1px solid var(--sage-line);border-radius:10px;background:var(--sage-fill);padding:16px}
.visual-panel-ar,.visual-cell-ar,.compare-ar,.visual-example-ar{direction:rtl;text-align:right;color:var(--forest);font-size:20px;line-height:2}
.visual-panel-en,.visual-cell-en,.compare-en,.visual-example-en{color:#526059;line-height:1.55;margin-top:3px}
.visual-compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:13px}
.compare-side{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:10px;text-align:center;min-width:0}
.compare-side .compare-ar{text-align:center;font-size:25px}
.compare-arrow{color:var(--forest-3);font-size:22px;font-weight:700}
.ending-focus{background:#f4dba9;border-radius:5px;color:#704c13}
.deleted-focus{background:#f6d0c8;border-radius:5px;padding:0 .1em;color:#8b3024;text-decoration:line-through;text-decoration-thickness:2px}
.compare-note{grid-column:1/-1;margin-top:2px;text-align:center}
.visual-table{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.visual-row{display:grid;grid-template-columns:repeat(var(--visual-cols),minmax(0,1fr));border-top:1px solid var(--line)}
.visual-row:first-child{border-top:0}
.visual-row.visual-head{background:var(--sage-fill)}
.visual-cell{min-width:0;padding:11px 12px;border-inline-start:1px solid var(--line)}
.visual-cell:first-child{border-inline-start:0}
.visual-head .visual-cell-ar{font-size:17px;font-weight:700}
.visual-head .visual-cell-en{font-size:12px}
.visual-cell-ar{font-size:18px;line-height:1.9}
.visual-cell-en{font-size:13px}
.visual-row-link{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);padding:9px 12px;background:color-mix(in srgb,var(--sage-fill) 45%,transparent)}
.visual-example{min-width:0}
.visual-example-ar{font-size:20px;line-height:1.9}
.visual-example-ar .quran-ref{font-size:.7em}
.help-visual .quran-ref{font-size:.68em;line-height:1.65;vertical-align:.08em}
.visual-open{border:1px solid var(--sage-line);background:var(--card);color:var(--forest-3);border-radius:8px;padding:8px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.visual-pairs{display:grid;gap:12px}
.visual-pair{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card)}
.visual-contrast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.visual-contrast.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.contrast-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px;min-width:0}
.contrast-label-ar{direction:rtl;text-align:right;color:var(--muted);font-size:17px;line-height:1.8}
.contrast-example{direction:rtl;text-align:center;color:var(--forest);font-size:34px;line-height:2.1;margin:6px 0}
.contrast-example .ending-focus{display:inline;background:transparent;border-radius:0;font-weight:700;text-decoration:underline;text-decoration-color:#c69a47;text-decoration-thickness:.13em;text-underline-offset:.13em}
.contrast-en{color:var(--muted);line-height:1.5;text-align:center}
.contrast-card .visual-open{display:block;margin:12px auto 0}
.demonstrative-number-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.demonstrative-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:15px;min-width:0}
.demonstrative-label-ar,.demonstrative-distance-title{direction:rtl;text-align:right;color:var(--forest);font-size:20px;font-weight:700;line-height:1.8}
.demonstrative-label-en,.demonstrative-form-en,.demonstrative-note-en{color:var(--muted);font-size:13px;line-height:1.45}
.demonstrative-form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.demonstrative-form:first-of-type{margin-top:7px;padding-top:0;border-top:0}
.demonstrative-form-ar{direction:rtl;text-align:center;color:var(--forest);font-size:24px;line-height:2;white-space:normal}
.demonstrative-form-en{text-align:center;margin-top:2px}
.demonstrative-card .visual-row-link{display:block;margin:11px -15px -15px;border-top:1px dashed var(--line);border-radius:0 0 10px 10px}
.demonstrative-card .visual-open{display:block;margin:8px auto 0}
.demonstrative-distance{margin-top:18px;border:1px solid var(--sage-line);border-radius:10px;background:var(--sage-fill);padding:15px}
.demonstrative-distance-title-en{display:block;color:var(--muted);font-family:var(--serif);font-size:15px;font-weight:400;line-height:1.35;direction:ltr;text-align:left}
.demonstrative-distance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.demonstrative-distance-card{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:13px;min-width:0}
.demonstrative-distance-card .demonstrative-form-ar{font-size:21px}
.demonstrative-note-ar{direction:rtl;text-align:right;color:var(--forest);font-size:17px;line-height:1.9;margin-top:7px}
.demonstrative-distance-card .visual-row-link{display:block;margin:10px -13px -13px;border-radius:0 0 9px 9px}
.demonstrative-distance-card .visual-open{display:block;margin:8px auto 0}
.relative-anatomy{border:1px solid var(--sage-line);border-radius:12px;background:var(--sage-fill);padding:18px;overflow:hidden}
.relative-sentence{direction:rtl;text-align:center;color:var(--forest);font-size:clamp(25px,4vw,38px);line-height:2.25;padding:10px 8px 18px}
.relative-noun-focus{display:inline;padding:1px 5px;border-radius:7px;background:var(--gold-soft);box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:700}
.relative-silah-focus{text-decoration:underline;text-decoration-color:#c69a47;text-decoration-thickness:.12em;text-underline-offset:.2em}
.relative-key{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.relative-key-card{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:12px;text-align:center}
.relative-label-ar{direction:rtl;color:var(--forest);font-size:18px;font-weight:700;line-height:1.8}
.relative-label-en{color:var(--muted);font-size:12px;line-height:1.35}
.relative-sample{direction:rtl;color:var(--heading);font-size:22px;line-height:1.9;margin-top:4px}
.relative-return{font-size:25px;font-weight:700}
.relative-return-note{direction:rtl;color:var(--muted);font-size:16px;line-height:1.8}
.relative-return-note-en{color:var(--muted);font-size:12px;line-height:1.4}
.relative-anatomy .visual-row-link{margin:14px -18px -18px;border-radius:0 0 12px 12px}
.article-meaning{border:1px solid var(--sage-line);border-radius:12px;background:var(--sage-fill);padding:18px;overflow:hidden}
.article-hero{text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px}
.article-word{direction:rtl;color:var(--heading);font-size:clamp(34px,5vw,48px);line-height:1.9}
.article-prefix-focus{background:var(--gold-soft);color:var(--forest);border-radius:4px;box-shadow:0 .08em 0 var(--gold);font-weight:inherit}
.article-note-ar{direction:rtl;color:var(--forest);font-size:18px;line-height:1.9;margin-top:4px}
.article-note-en{color:var(--muted);font-size:14px;line-height:1.55;margin-top:3px}
.article-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.article-group{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:13px}
.article-group-title-ar{direction:rtl;color:var(--forest);font-size:20px;font-weight:700;line-height:1.7}
.article-group-title-en{color:var(--muted);font-size:12px;line-height:1.35}
.article-kind{padding:10px 0;border-top:1px dashed var(--line)}
.article-kind:first-of-type{margin-top:5px}
.article-kind-ar{direction:rtl;color:var(--heading);font-size:17px;font-weight:700;line-height:1.7}
.article-kind-en{color:var(--muted);font-size:12px;line-height:1.35}
.article-example{direction:rtl;color:var(--text);font-size:19px;line-height:1.95;margin-top:3px}
.article-example-ref{display:block;color:var(--muted);font-size:13px;line-height:1.55}
.article-meaning .visual-row-link{margin:14px -18px -18px;border-radius:0 0 12px 12px}
.idafa-definiteness{border:1px solid var(--sage-line);border-radius:12px;background:var(--sage-fill);padding:18px;overflow:hidden}
.idafa-hero{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px}
.idafa-phrase{display:flex;direction:rtl;justify-content:center;align-items:baseline;gap:.28em;color:var(--heading);font-size:clamp(34px,5vw,48px);line-height:1.9;white-space:nowrap}
.idafa-first,.idafa-second{padding:0 .16em;border-radius:6px}
.idafa-first-word .idafa-first{padding-inline-start:0}
.idafa-list-waw{color:var(--heading)}
.idafa-first{background:var(--sage-fill);box-shadow:inset 0 -.09em 0 var(--sage-line)}
.idafa-second{background:var(--gold-soft);box-shadow:inset 0 -.09em 0 var(--gold)}
.idafa-term-labels{display:grid;direction:rtl;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.idafa-term-card{min-width:0;text-align:center}
.idafa-label-ar{direction:rtl;color:var(--forest);font-size:18px;font-weight:700;line-height:1.7}
.idafa-label-en{color:var(--muted);font-size:12px;line-height:1.35}
.idafa-term-note-ar{direction:rtl;color:var(--text);font-size:16px;line-height:1.8;margin-top:4px}
.idafa-term-note-en{color:var(--muted);font-size:13px;line-height:1.5;margin-top:2px}
.idafa-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.idafa-type{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:12px;text-align:center}
.idafa-type-label-ar{direction:rtl;color:var(--forest);font-size:17px;font-weight:700;line-height:1.7}
.idafa-type-label-en{color:var(--muted);font-size:12px;line-height:1.35}
.idafa-type-example{direction:rtl;color:var(--heading);font-size:21px;line-height:2;margin-top:4px;white-space:normal}
.idafa-definite-focus{background:var(--gold-soft);color:var(--forest);border-radius:4px;box-shadow:0 .08em 0 var(--gold);font-weight:inherit}
.idafa-type-note-ar{direction:rtl;color:var(--muted);font-size:15px;line-height:1.65}
.idafa-type-note-en{color:var(--muted);font-size:12px;line-height:1.4}
.idafa-definiteness .visual-row-link{margin:14px -18px -18px;border-radius:0 0 12px 12px}
.faail-overview{display:grid;gap:18px}
.faail-category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;counter-reset:faail-category}
.faail-category{counter-increment:faail-category;position:relative;border:1px solid var(--sage-line);border-radius:11px;background:var(--sage-fill);padding:12px 46px 12px 12px;min-height:74px}
.faail-category::after{content:counter(faail-category);position:absolute;inset-inline-end:12px;top:13px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--sage-line);color:var(--muted);font:700 .78rem/1 var(--sans)}
.faail-category.current{border-color:var(--forest);background:var(--sage-fill);box-shadow:inset 4px 0 0 var(--forest)}
.faail-category.current::after{background:var(--forest);border-color:var(--forest);color:#fff}
.faail-category-ar{direction:rtl;font-size:1.12rem;line-height:1.65;color:var(--heading)}
.faail-category-en{margin-top:2px;font-size:.82rem;line-height:1.35;color:var(--muted)}
.faail-current{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:3px 8px;border-radius:999px;background:var(--forest);color:#fff;font-size:.72rem;font-weight:700}
.faail-current-en{font-family:var(--sans);font-size:.68rem;font-weight:700}
.faail-relation{border:1px solid var(--sage-line);border-radius:12px;background:var(--card);padding:18px;overflow:hidden}
.faail-relation-title{font-weight:700;color:var(--forest);margin-bottom:10px}
.faail-sentence{display:flex;justify-content:center;align-items:flex-end;gap:24px;direction:rtl;font-size:2rem;line-height:2.1;padding:10px 8px}
.faail-piece{position:relative;padding:0 7px;border-radius:8px}
.faail-verb-focus{background:var(--tan);box-shadow:inset 0 -3px 0 var(--gold)}
.faail-subject-focus{background:var(--sage-fill);box-shadow:inset 0 -3px 0 var(--forest)}
.faail-piece-label{position:absolute;top:calc(100% - 3px);inset-inline:0;text-align:center;font-size:.72rem;line-height:1.25;color:var(--muted);white-space:nowrap}
.faail-piece-label-en{display:block;font-family:var(--sans);font-size:.65rem}
.faail-reference{text-align:center;margin-top:26px;color:var(--muted);font-size:.9rem}
.faail-relation .visual-row-link{margin:14px -18px -18px;border-radius:0 0 12px 12px}
.help-actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.help-actions button{width:auto;min-width:180px}
.help-chapter-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.help-chapter-nav button{min-width:0;text-align:center;line-height:1.45}

/* Preferences */
.preferences-card{max-width:720px;margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(22px,4vw,34px);display:flex;align-items:center;justify-content:space-between;gap:24px}
.preferences-copy h2{margin:0;color:var(--heading);font-family:var(--serif);font-size:24px;font-weight:400}
.preferences-copy p{margin:7px 0 0;color:var(--muted);line-height:1.55}
.preferences-theme .theme-btn{min-width:86px}

/* Dark theme */
html[data-theme="dark"]{color-scheme:dark;--heading:#e5eee8;--ink:#e8efeb;--muted:#aebbb4;--paper:#0f1714;--card:#17211d;--line:#34443d;--sage-fill:#24372f;--sage-line:#78927b;--gold-soft:#30291d;--tan:#33291d;--slate:#252d3b}
html[data-theme="dark"] .topbar{background:rgba(15,23,20,.94)}
html[data-theme="dark"] .mobile-menu,html[data-theme="dark"] .chapter-select,html[data-theme="dark"] .secondary,html[data-theme="dark"] .word-card{background:var(--card);color:var(--ink)}
html[data-theme="dark"] .language-switch,html[data-theme="dark"] .theme-switch{background:#25332d;border-color:#405149}
html[data-theme="dark"] .example-filter{background:#25332d;border-color:#405149}
html[data-theme="dark"] .filter-btn{color:#bdc9c2}
html[data-theme="dark"] .filter-btn.active{background:#41534b;color:#fff;box-shadow:0 1px 4px #0006}
html[data-theme="dark"] .lang-btn,html[data-theme="dark"] .theme-btn{color:#bdc9c2}
html[data-theme="dark"] .lang-btn.active,html[data-theme="dark"] .theme-btn.active{background:#41534b;color:#fff;box-shadow:0 1px 4px #0006}
html[data-theme="dark"] .subject-card:hover,html[data-theme="dark"] .choice-card:hover,html[data-theme="dark"] .secondary:hover:not(:disabled){border-color:#64806f}
html[data-theme="dark"] .card-ar,html[data-theme="dark"] .sentence,html[data-theme="dark"] .word-ar,html[data-theme="dark"] .help-ar{color:#dcebe1}
html[data-theme="dark"] .parsed-focus{color:#dff0e3}
html[data-theme="dark"] .tone-sage{background:#263a30;color:#b9d2bd}
html[data-theme="dark"] .tone-tan{color:#e3bc7d}
html[data-theme="dark"] .tone-slate{color:#b9c7e4}
html[data-theme="dark"] .card-radio{background:#18231f;border-color:#617169}
html[data-theme="dark"] .translation,html[data-theme="dark"] .iraab-en,html[data-theme="dark"] .help-en{color:#c2cdc7}

html[data-theme="dark"] .book-page{background:#24372f;border-color:#4d6a59;color:#cfe1d3}
html[data-theme="dark"] .why-toggle,html[data-theme="dark"] .mode-link{color:#9acbb7}
html[data-theme="dark"] .chapter-essentials-link,html[data-theme="dark"] .help-jump{background:#24372f;border-color:#526f5e;color:#c8e3d5}
html[data-theme="dark"] .why-text{background:#29251d;color:#d7d0c3}
html[data-theme="dark"] .source-detail{border-color:#594b36;color:#d8ceba}
html[data-theme="dark"] .primary{background:#39725b;border-color:#579276}
html[data-theme="dark"] .primary:hover:not(:disabled){background:#458369}
html[data-theme="dark"] .quran-ref{color:#b8c6be}
html[data-theme="dark"] .visual-title,html[data-theme="dark"] .visual-branch-ar,html[data-theme="dark"] .visual-panel-ar,html[data-theme="dark"] .visual-cell-ar,html[data-theme="dark"] .compare-ar,html[data-theme="dark"] .visual-example-ar,html[data-theme="dark"] .contrast-example{color:#dcebe1}
html[data-theme="dark"] .visual-panel-en,html[data-theme="dark"] .visual-cell-en,html[data-theme="dark"] .compare-en,html[data-theme="dark"] .visual-example-en{color:#c2cdc7}
html[data-theme="dark"] .visual-open{background:#1d2a25;color:#a9d9c5;border-color:#567665}
html[data-theme="dark"] .ending-focus{background:#5b4728;color:#ffe2a8}
html[data-theme="dark"] .contrast-example .ending-focus{background:transparent;color:#ffe2a8;text-decoration-color:#d8ae5c}
html[data-theme="dark"] .deleted-focus{background:#5b302b;color:#ffd4ca}
html[data-theme="dark"] .relative-sentence,html[data-theme="dark"] .relative-label-ar{color:#dcebe1}
html[data-theme="dark"] .relative-noun-focus{background:#5b4728;color:#ffe2a8}
html[data-theme="dark"] .relative-silah-focus{text-decoration-color:#d8ae5c}
html[data-theme="dark"] .help-core{background:#21332b;border-color:#587462}
html[data-theme="dark"] .help-core-title,html[data-theme="dark"] .help-essential-ar,html[data-theme="dark"] .help-disclosure-title-ar{color:#dcebe1}
html[data-theme="dark"] .help-core-en,html[data-theme="dark"] .help-essential-en{color:#c2cdc7}
html[data-theme="dark"] .help-cautions{background:#30291d;border-color:#594b36}
html[data-theme="dark"] .help-disclosure[open] summary{background:#24372f}

/* Arabic-only mode */
.rtl .crumb,.rtl .subject-card,.rtl .choice-card{text-align:right}
.rtl .brand-en,.rtl .screen-sub.arabic,.rtl .card-title,.rtl .help-en{display:none}
.rtl .brand-ar{display:block}

const mobileLayout = window.matchMedia('(max-width:760px)');
function setDrawerOpen(requested, {restoreFocus = true} = {}) {
 const drawer = $('primaryDrawer');
 const toggle = $('mobileMenu');
 const backdrop = $('drawerBackdrop');
 const wasOpen = toggle.getAttribute('aria-expanded') === 'true';
 const focused = document.activeElement;
 const open = mobileLayout.matches && requested;

 document.body.classList.toggle('menu-open', open);
 drawer.hidden = mobileLayout.matches && !open;
 drawer.inert = drawer.hidden;
 backdrop.hidden = !open;
 backdrop.inert = !open;
 $('mainContent').inert = open;
 toggle.setAttribute('aria-expanded', String(open));
 toggle.setAttribute('aria-label', accessibleName(open ? 'closeMenu' : 'openMenu'));

 if (open) {
  drawer.setAttribute('role', 'dialog');
  drawer.setAttribute('aria-modal', 'true');
  if (!wasOpen) focusVisible($('drawerClose'));
  return;
 }
 drawer.removeAttribute('role');
 drawer.removeAttribute('aria-modal');
 if (restoreFocus && mobileLayout.matches && (wasOpen || drawer.contains(focused))) focusVisible(toggle);
 if (restoreFocus && !mobileLayout.matches && (wasOpen || focused === $('drawerClose'))) focusVisible(drawer.querySelector('.side-brand'));
}
