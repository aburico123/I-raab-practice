    </div>
  </main>
</div>

<script>

 en:{home:'Home',workspace:'Your Workspace',practice:'Practice',appName:'Miftāḥ al-ʿIlm',nahw:'Nahw',nahwDesc:'Practice complete iʿrāb from al-Mutammimah.',bookPractice:'Book Practice',bookDesc:'Examples verified against the selected edition.',extraPractice:'Extra Practice',extraDesc:'Checked generated patterns for the opening lesson.',chapterHelp:'Chapter Help',helpDesc:'Review terms and rules separately.',nahwMenu:'← Nahw menu',reveal:'Reveal iʿrāb',hide:'Hide iʿrāb',next:'Next',fullIraab:'Full iʿrāb',why:'Why?',hideWhy:'Hide why',returnPractice:'Return to practice',returnNahw:'Back to Nahw',bookCrumb:'Nahw · Book Practice',extraCrumb:'Nahw · Extra Practice',helpCrumb:'Nahw · Chapter Help',nahwCrumb:'Nahw',babLabel:'Bāb / section',chapterLabel:'Chapter within it',printed:'printed pp.',item:'Exercise',of:'of',generated:'Generated practice · checked against printed p. 19'},
 ar:{home:'الرَّئِيسِيَّةُ',workspace:'مَسَاحَتُكَ',practice:'التَّدْرِيبُ',appName:'مِفْتَاحُ الْعِلْمِ',nahw:'النَّحْوُ',nahwDesc:'تَدَرَّبْ عَلَى الْإِعْرَابِ التَّامِّ مِنَ الْمُتَمِّمَةِ.',bookPractice:'تَدْرِيبَاتُ الْكِتَابِ',bookDesc:'أَمْثِلَةٌ مُرَاجَعَةٌ عَلَى الطَّبْعَةِ الْمُخْتَارَةِ.',extraPractice:'تَدْرِيبَاتٌ إِضَافِيَّةٌ',extraDesc:'أَنْمَاطٌ مُوَلَّدَةٌ مُرَاجَعَةٌ لِلدَّرْسِ الْأَوَّلِ.',chapterHelp:'شَرْحُ الْبَابِ',helpDesc:'رَاجِعِ الْمُصْطَلَحَاتِ وَالْقَوَاعِدَ مُسْتَقِلًّا.',nahwMenu:'قَائِمَةُ النَّحْوِ ←',reveal:'أَظْهِرِ الْإِعْرَابَ',hide:'أَخْفِ الْإِعْرَابَ',next:'التَّالِي',fullIraab:'الْإِعْرَابُ التَّامُّ',why:'لِمَاذَا؟',hideWhy:'أَخْفِ السَّبَبَ',returnPractice:'الْعَوْدَةُ إِلَى التَّدْرِيبِ',returnNahw:'الْعَوْدَةُ إِلَى النَّحْوِ',bookCrumb:'النَّحْوُ · تَدْرِيبَاتُ الْكِتَابِ',extraCrumb:'النَّحْوُ · تَدْرِيبَاتٌ إِضَافِيَّةٌ',helpCrumb:'النَّحْوُ · شَرْحُ الْبَابِ',nahwCrumb:'النَّحْوُ',babLabel:'الْبَابُ أَوِ الْقِسْمُ',chapterLabel:'الْفَصْلُ دَاخِلَهُ',printed:'الصَّفَحَاتُ',item:'التَّدْرِيبُ',of:'مِنْ',generated:'تَدْرِيبٌ مُوَلَّدٌ · مُرَاجَعٌ عَلَى ص ١٩'}
};
const defaults={version:3,lang:'en',screen:'home',mode:'book',selectedBabId:'opening',selectedChapterId:'speech-core',helpBabId:'opening',helpChapterId:'speech-core',positions:{'speech-core':0},generatedIndex:0,revealed:false,resumeAvailable:false,completed:[],difficult:[]};

const $=id=>document.getElementById(id),save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state)),tr=key=>copy[state.lang][key]||key;

function renderNav(){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===`${state.screen}Screen`));document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',(state.screen==='home'&&n.dataset.go==='home')||(state.screen!=='home'&&n.dataset.go==='nahw')));const crumbKeys={home:'home',nahw:'nahwCrumb',help:'helpCrumb',practice:state.mode==='book'?'bookCrumb':'extraCrumb'};$('crumb').textContent=tr(crumbKeys[state.screen]);$('returnPractice').style.display=state.resumeAvailable?'inline-flex':'none'}
function renderAnswer(exercise){const arabic=state.lang==='ar';$('answers').innerHTML=exercise.tokens.map((token,index)=>`<article class="word-card"><div class="word-head"><span class="word-gloss">${arabic?'':token.gloss}</span><span class="word-ar arabic" lang="ar">${token.word}</span></div><div class="iraab-ar arabic" lang="ar">${token.ar}</div>${arabic?'':`<div class="iraab-en">${token.en}</div>`}<button class="why-toggle" data-why="${index}" aria-expanded="false">${tr('why')}</button><div class="why-text ${arabic?'why-ar arabic':''}" id="why-${index}">${arabic?token.whyAr:token.whyEn}</div></article>`).join('');$('sourceDetail').textContent=arabic?exercise.sourceAr:exercise.sourceEn}
function renderPractice(){const exercise=currentExercise(),chapter=selectedChapter(),arabic=state.lang==='ar',index=currentIndex(),total=state.mode==='extra'?null:chapter.book.length;$('sentence').textContent=exercise.ar;$('translation').textContent=exercise.en;$('translation').style.display=arabic?'none':'block';$('answerPanel').classList.toggle('open',state.revealed);$('revealBtn').textContent=state.revealed?tr('hide'):tr('reveal');$('nextBtn').textContent=tr('next');$('nextBtn').disabled=state.mode==='book'&&index===total-1;$('chapterMeta').textContent=state.mode==='extra'?tr('generated'):`${tr('item')} ${localDigits(index+1)} ${tr('of')} ${localDigits(total)} · ${tr('printed')} ${localDigits(chapter.pages)}`;renderAnswer(exercise)}
function renderHelp(){const chapter=chapterById(state.helpChapterId),arabic=state.lang==='ar';$('helpChapterName').textContent=optionLabel(chapter);$('helpSections').innerHTML=chapter.help.map(section=>`<section class="help-section"><div class="help-ar arabic" lang="ar">${section.ar}</div>${arabic?'':`<div class="help-en">${section.en}</div>`}</section>`).join('');$('helpSource').textContent=arabic?chapter.helpSourceAr:chapter.helpSourceEn}
function render(){validateSelection();renderLanguage();renderPickers();renderNav();renderPractice();renderHelp();save()}
document.querySelectorAll('[data-go]').forEach(button=>button.addEventListener('click',()=>setScreen(button.dataset.go)));document.querySelectorAll('[data-start]').forEach(button=>button.addEventListener('click',()=>startPractice(button.dataset.start)));document.querySelectorAll('[data-help]').forEach(button=>button.addEventListener('click',openHelp));document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{state.lang=button.dataset.lang;render()}));
$('nahwMenuLink').addEventListener('click',()=>setScreen('nahw'));$('returnPractice').addEventListener('click',()=>setScreen('practice'));$('returnNahw').addEventListener('click',()=>setScreen('nahw'));$('revealBtn').addEventListener('click',()=>{state.revealed=!state.revealed;render()});$('nextBtn').addEventListener('click',()=>{if(state.mode==='book'){const chapter=selectedChapter(),index=currentIndex();if(index>=chapter.book.length-1)return;state.positions[chapter.id]=index+1}else state.generatedIndex+=1;state.revealed=false;render()});
$('babSelect').addEventListener('change',event=>{state.selectedBabId=event.target.value;state.selectedChapterId=chaptersFor(state.selectedBabId)[0].id;state.revealed=false;render()});$('chapterSelect').addEventListener('change',event=>{state.selectedChapterId=event.target.value;state.revealed=false;render()});$('helpBabSelect').addEventListener('change',event=>{state.helpBabId=event.target.value;state.helpChapterId=chaptersFor(state.helpBabId)[0].id;render()});$('helpChapterSelect').addEventListener('change',event=>{state.helpChapterId=event.target.value;render()});
$('answers').addEventListener('click',event=>{const button=event.target.closest('[data-why]');if(!button)return;const why=$(`why-${button.dataset.why}`),open=why.classList.toggle('open');button.setAttribute('aria-expanded',String(open));button.textContent=open?tr('hideWhy'):tr('why')});$('mobileMenu').addEventListener('click',()=>document.body.classList.toggle('menu-open'));$('drawerBackdrop').addEventListener('click',()=>document.body.classList.remove('menu-open'));
window.miftahTestState=()=>({...state});window.miftahContentSummary=()=>chapters.map(c=>({id:c.id,babId:c.babId,pages:c.pages,count:c.book.length,ids:c.book.map(e=>e.id)}));render();
})();
</script>
</body>
